name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check Python syntax
        run: python -m py_compile desktop_widget.pyw study_hub/bootstrap.py study_hub/config.py study_hub/http_server.py study_hub/planning/service.py study_hub/widget.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check browser script syntax
        run: node --check app.js
